name: Release binaries

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Compile all targets
        run: bun run compile:all

      # `--version` exits before the TUI starts, so this works on a runner
      # without a TTY (Ink would fail on raw mode otherwise).
      - name: Smoke-test the linux binary
        run: |
          output="$(timeout 5 ./bin/kith-linux-x64 --version 2>&1)"
          echo "$output"
          echo "$output" | grep -qF "$(jq -r .version package.json)"

      # The other targets can't execute on an ubuntu runner, but we can at
      # least verify each binary was compiled for the correct platform.
      - name: Verify all target binaries
        run: |
          file bin/kith-linux-x64 | grep -q "ELF 64-bit.*x86-64"
          file bin/kith-linux-arm64 | grep -qi "ELF 64-bit.*aarch64"
          file bin/kith-darwin-x64 | grep -q "Mach-O 64-bit.*x86_64"
          file bin/kith-darwin-arm64 | grep -q "Mach-O 64-bit.*arm64"

      - name: Generate checksums
        run: cd bin && sha256sum kith-* > checksums.txt

      - name: Upload release assets
        run: gh release upload "$GITHUB_REF_NAME" bin/kith-linux-x64 bin/kith-linux-arm64 bin/kith-darwin-x64 bin/kith-darwin-arm64 bin/checksums.txt --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
